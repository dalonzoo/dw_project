<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <style>
      .title { font: 700 38px Arial, Helvetica, sans-serif; fill: #253047; }
      .subtitle { font: 20px Arial, Helvetica, sans-serif; fill: #4b5568; }
      .box-title { font: 700 18px Arial, Helvetica, sans-serif; fill: #1f2937; }
      .box-text { font: 15px Arial, Helvetica, sans-serif; fill: #1f2937; }
      .small { font: 13px Arial, Helvetica, sans-serif; fill: #374151; }
      .note { font: 15px Arial, Helvetica, sans-serif; fill: #4b5563; }
      .fact { fill: #f8d4d4; stroke: #b85450; stroke-width: 2; }
      .date { fill: #dbeafe; stroke: #6c8ebf; stroke-width: 1.5; }
      .context { fill: #dcf2d8; stroke: #82b366; stroke-width: 1.5; }
      .geo { fill: #fff2cc; stroke: #d6b656; stroke-width: 1.5; }
      .type { fill: #eadcf0; stroke: #9673a6; stroke-width: 1.5; }
      .line { stroke: #111827; stroke-width: 1.8; fill: none; }
      .dash { stroke: #4b5563; stroke-width: 1.5; stroke-dasharray: 7 6; fill: none; }
      .label { font: 13px Arial, Helvetica, sans-serif; fill: #374151; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#111827" />
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#4b5563" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="760" fill="#ffffff" />

  <g transform="translate(0,-95)">

  <!-- Fact -->
  <rect x="600" y="330" width="400" height="245" rx="4" fill="#f8d4d4" stroke="#b85450" stroke-width="2" />
  <text x="625" y="362" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2937">TRIP</text>
  <text x="625" y="390" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937">Grain: one accepted Citi Bike ride</text>
  <text x="625" y="424" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Measures</text>
  <text x="625" y="450" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937">trip_count</text>
  <text x="625" y="474" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937">duration_seconds / duration_minutes</text>
  <text x="625" y="498" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937">approximate_distance_km</text>
  <text x="625" y="522" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937">night_trip_count</text>
  <text x="625" y="546" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937">member/casual counts, flow indicators</text>
  <text x="625" y="570" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">Degenerate/descriptive identifiers: ride_id, flow_direction</text>

  <!-- Date hierarchy -->
  <rect x="70" y="155" width="445" height="190" rx="4" fill="#dbeafe" stroke="#6c8ebf" stroke-width="1.5" />
  <text x="95" y="188" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Date hierarchy</text>
  <text x="95" y="215" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937">Roles: start date, end date</text>
  <text x="95" y="250" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937">date -&gt; month -&gt; quarter -&gt; year</text>
  <text x="95" y="275" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937">date -&gt; week -&gt; year</text>
  <text x="95" y="300" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937">date -&gt; season -&gt; year</text>
  <text x="95" y="325" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">Descriptive: day name, weekend flag</text>

  <!-- Time hierarchy -->
  <rect x="590" y="125" width="420" height="150" rx="4" fill="#dbeafe" stroke="#6c8ebf" stroke-width="1.5" />
  <text x="615" y="158" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Time hierarchy</text>
  <text x="615" y="185" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937">Roles: start time, end time</text>
  <text x="615" y="220" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937">hour -&gt; part_of_day -&gt; day_night_class</text>
  <text x="615" y="245" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">Descriptive: hour label, night-hour flag</text>

  <!-- Calendar context -->
  <rect x="1090" y="145" width="440" height="195" rx="4" fill="#dcf2d8" stroke="#82b366" stroke-width="1.5" />
  <text x="1115" y="178" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Calendar-event context</text>
  <text x="1115" y="205" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937">Date-scoped, linked to trip start context</text>
  <text x="1115" y="240" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937">date -&gt; holiday_window</text>
  <text x="1115" y="265" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937">date -&gt; event_group</text>
  <text x="1115" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">Optional/descriptive: holiday_name*, holiday_type*</text>
  <text x="1115" y="315" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">Flags: public holiday, eve, post-holiday, bridge day, long weekend</text>

  <!-- Weather context -->
  <rect x="1095" y="410" width="435" height="175" rx="4" fill="#dcf2d8" stroke="#82b366" stroke-width="1.5" />
  <text x="1120" y="443" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Weather context</text>
  <text x="1120" y="470" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937">Daily Central Park observation</text>
  <text x="1120" y="505" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937">weather_day -&gt; condition_class</text>
  <text x="1120" y="530" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937">weather_day -&gt; severity_label</text>
  <text x="1120" y="555" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">Descriptive values: temperature, precipitation, snow, wind</text>

  <!-- Station geography -->
  <rect x="70" y="405" width="470" height="225" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5" />
  <text x="95" y="438" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Station and geography hierarchy</text>
  <text x="95" y="465" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937">Roles: start station/geography, end station/geography</text>
  <text x="95" y="505" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937">station -&gt; NTA -&gt; CDTA/community district</text>
  <text x="95" y="530" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937">CDTA/community district -&gt; borough -&gt; city</text>
  <text x="95" y="570" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">Optional geography assignment covers outside-NYC or unknown stations.</text>
  <text x="95" y="595" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">Origin-destination analyses use the same hierarchy in two roles.</text>

  <!-- Compact dimensions -->
  <rect x="575" y="675" width="210" height="95" rx="4" fill="#eadcf0" stroke="#9673a6" stroke-width="1.5" />
  <text x="600" y="710" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2937">User type</text>
  <text x="600" y="740" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937">member / casual</text>

  <rect x="830" y="675" width="225" height="95" rx="4" fill="#eadcf0" stroke="#9673a6" stroke-width="1.5" />
  <text x="855" y="710" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Rideable type</text>
  <text x="855" y="740" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937">classic / electric</text>

  <!-- Conceptual note -->
  <rect x="1110" y="675" width="420" height="135" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="1135" y="708" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Conceptual level</text>
  <text x="1135" y="736" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5563">This diagram is intentionally independent</text>
  <text x="1135" y="760" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5563">from PostgreSQL table names. The next slide</text>
  <text x="1135" y="784" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5563">shows the implemented ROLAP translation.</text>

  <!-- Connections from dimensions to fact -->
  <path d="M515 285 C555 315, 570 360, 600 405" stroke="#111827" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <text x="520" y="330" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#374151">start/end date</text>

  <path d="M800 275 L800 330" stroke="#111827" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <text x="815" y="308" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#374151">start/end time</text>

  <path d="M1090 255 C1045 280, 1025 315, 1000 360" stroke="#111827" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <text x="1018" y="305" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#374151">start-date context</text>

  <path d="M1095 500 C1055 500, 1030 500, 1000 500" stroke="#111827" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <text x="1018" y="487" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#374151">start weather day</text>

  <path d="M540 515 C565 515, 580 508, 600 500" stroke="#111827" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <text x="435" y="500" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#374151">origin/destination</text>

  <path d="M680 675 L710 575" stroke="#111827" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <path d="M945 675 L900 575" stroke="#111827" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />

  </g>
</svg>
