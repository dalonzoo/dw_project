<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <rect x="0" y="0" width="1600" height="760" fill="#ffffff" />

  <!-- Helper colors: table headers mirror the compact star-schema notation used in the course slides. -->

  <!-- Dimension tables -->
  <rect x="80" y="90" width="360" height="150" fill="#ffffff" stroke="#333333" stroke-width="2" />
  <rect x="80" y="90" width="360" height="40" fill="#d9d9d9" stroke="#333333" stroke-width="2" />
  <text x="260" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#333333">dw.dim_date</text>
  <text x="110" y="158" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#333333">PK date_key</text>
  <text x="110" y="185" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#333333">UK date_value</text>
  <text x="110" y="212" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#333333">year, season, quarter, month, week</text>

  <rect x="635" y="40" width="330" height="135" fill="#ffffff" stroke="#333333" stroke-width="2" />
  <rect x="635" y="40" width="330" height="40" fill="#d9d9d9" stroke="#333333" stroke-width="2" />
  <text x="800" y="68" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#333333">dw.dim_time</text>
  <text x="665" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#333333">PK time_key</text>
  <text x="665" y="135" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#333333">UK hour_number</text>
  <text x="665" y="162" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#333333">part_of_day, day_night_class</text>

  <rect x="1150" y="90" width="360" height="150" fill="#ffffff" stroke="#333333" stroke-width="2" />
  <rect x="1150" y="90" width="360" height="40" fill="#d9d9d9" stroke="#333333" stroke-width="2" />
  <text x="1330" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#333333">dw.dim_calendar_event</text>
  <text x="1180" y="158" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#333333">PK calendar_event_key</text>
  <text x="1180" y="185" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#333333">UK date_value</text>
  <text x="1180" y="212" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#333333">holiday_window, event_group</text>

  <rect x="80" y="330" width="330" height="145" fill="#ffffff" stroke="#333333" stroke-width="2" />
  <rect x="80" y="330" width="330" height="40" fill="#d9d9d9" stroke="#333333" stroke-width="2" />
  <text x="245" y="358" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#333333">dw.dim_station</text>
  <text x="110" y="398" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#333333">PK station_key</text>
  <text x="110" y="425" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#333333">UK station_id</text>
  <text x="110" y="452" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#333333">FK geography_key</text>

  <rect x="1190" y="330" width="330" height="145" fill="#ffffff" stroke="#333333" stroke-width="2" />
  <rect x="1190" y="330" width="330" height="40" fill="#d9d9d9" stroke="#333333" stroke-width="2" />
  <text x="1355" y="358" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#333333">dw.dim_weather</text>
  <text x="1220" y="398" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#333333">PK weather_key</text>
  <text x="1220" y="425" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#333333">UK observation_date</text>
  <text x="1220" y="452" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#333333">condition_class, severity_label</text>

  <rect x="80" y="575" width="360" height="145" fill="#ffffff" stroke="#333333" stroke-width="2" />
  <rect x="80" y="575" width="360" height="40" fill="#d9d9d9" stroke="#333333" stroke-width="2" />
  <text x="260" y="603" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#333333">dw.dim_geography</text>
  <text x="110" y="643" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#333333">PK geography_key</text>
  <text x="110" y="670" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#333333">UK geography_code</text>
  <text x="110" y="697" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#333333">NTA, CDTA, borough, city</text>

  <rect x="560" y="595" width="270" height="115" fill="#ffffff" stroke="#333333" stroke-width="2" />
  <rect x="560" y="595" width="270" height="40" fill="#d9d9d9" stroke="#333333" stroke-width="2" />
  <text x="695" y="623" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#333333">dw.dim_user_type</text>
  <text x="590" y="663" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#333333">PK user_type_key</text>
  <text x="590" y="690" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#333333">UK rider_type</text>

  <rect x="885" y="595" width="300" height="115" fill="#ffffff" stroke="#333333" stroke-width="2" />
  <rect x="885" y="595" width="300" height="40" fill="#d9d9d9" stroke="#333333" stroke-width="2" />
  <text x="1035" y="623" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#333333">dw.dim_rideable_type</text>
  <text x="915" y="663" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#333333">PK rideable_type_key</text>
  <text x="915" y="690" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#333333">UK rideable_type</text>

  <!-- Central ride-grain fact table -->
  <rect x="585" y="250" width="430" height="245" fill="#ffffff" stroke="#333333" stroke-width="2.2" />
  <rect x="585" y="250" width="430" height="45" fill="#d9d9d9" stroke="#333333" stroke-width="2.2" />
  <text x="800" y="281" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#333333">dw.fact_trip</text>
  <text x="615" y="323" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#333333">PK fact_trip_key</text>
  <text x="615" y="350" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#333333">UK ride_id</text>
  <text x="615" y="382" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#333333">FK start/end date, start/end time</text>
  <text x="615" y="410" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#333333">FK event, weather</text>
  <text x="615" y="438" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#333333">FK start/end station, geography</text>
  <text x="615" y="466" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#333333">measures: trip_count, duration, distance</text>

  <!-- Secondary aggregate fact table -->
  <rect x="1240" y="590" width="330" height="140" fill="#ffffff" stroke="#777777" stroke-width="2" />
  <rect x="1240" y="590" width="330" height="40" fill="#e6e6e6" stroke="#777777" stroke-width="2" />
  <text x="1405" y="618" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#333333">dw.fact_station_day_hour</text>
  <text x="1265" y="658" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#333333">aggregate fact table</text>
  <text x="1265" y="684" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#333333">FK station, date, time, event, weather</text>
  <text x="1265" y="710" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#333333">starts, ends, net_flow</text>

  <!-- Fact-to-dimension foreign-key edges -->
  <line x1="440" y1="165" x2="585" y2="320" stroke="#333333" stroke-width="2" />
  <text x="460" y="242" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" fill="#333333">start/end date</text>

  <line x1="800" y1="175" x2="800" y2="250" stroke="#333333" stroke-width="2" />
  <text x="815" y="220" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" fill="#333333">start/end time</text>

  <line x1="1150" y1="165" x2="1015" y2="320" stroke="#333333" stroke-width="2" />
  <text x="1036" y="242" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" fill="#333333">start event</text>

  <line x1="410" y1="402" x2="585" y2="402" stroke="#333333" stroke-width="2" />
  <text x="440" y="388" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" fill="#333333">start/end station</text>

  <line x1="1190" y1="402" x2="1015" y2="402" stroke="#333333" stroke-width="2" />
  <text x="1046" y="388" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" fill="#333333">start weather</text>

  <line x1="440" y1="650" x2="585" y2="458" stroke="#333333" stroke-width="2" />
  <text x="452" y="553" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" fill="#333333">start/end geography</text>

  <line x1="695" y1="595" x2="735" y2="495" stroke="#333333" stroke-width="2" />
  <line x1="1035" y1="595" x2="895" y2="495" stroke="#333333" stroke-width="2" />

  <!-- Controlled snowflake edge -->
  <line x1="245" y1="475" x2="260" y2="575" stroke="#333333" stroke-width="2" stroke-dasharray="8 6" />
  <text x="280" y="535" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" fill="#333333">snowflake FK</text>
</svg>
