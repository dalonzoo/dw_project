<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff" />

  <!-- Date hierarchy -->
  <ellipse cx="430" cy="165" rx="340" ry="105" fill="#dcefed" opacity="0.96" />
  <line x1="190" y1="170" x2="350" y2="170" stroke="#1f4f55" stroke-width="4" stroke-linecap="round" />
  <line x1="350" y1="170" x2="530" y2="170" stroke="#1f4f55" stroke-width="4" stroke-linecap="round" />
  <line x1="530" y1="170" x2="700" y2="170" stroke="#1f4f55" stroke-width="4" stroke-linecap="round" />
  <circle cx="190" cy="170" r="17" fill="#123b40" />
  <circle cx="350" cy="170" r="17" fill="#123b40" />
  <circle cx="530" cy="170" r="17" fill="#123b40" />
  <circle cx="700" cy="170" r="17" fill="#123b40" />
  <text x="118" y="132" fill="#23383b" font-family="Georgia, 'Times New Roman', serif" font-size="36">date</text>
  <text x="292" y="132" fill="#23383b" font-family="Georgia, 'Times New Roman', serif" font-size="36">month</text>
  <text x="456" y="132" fill="#23383b" font-family="Georgia, 'Times New Roman', serif" font-size="36">quarter</text>
  <text x="720" y="132" fill="#23383b" font-family="Georgia, 'Times New Roman', serif" font-size="36">year</text>

  <!-- Time hierarchy -->
  <ellipse cx="1175" cy="165" rx="360" ry="105" fill="#e8f2ef" opacity="0.96" />
  <line x1="930" y1="170" x2="1110" y2="170" stroke="#1f4f55" stroke-width="4" stroke-linecap="round" />
  <line x1="1110" y1="170" x2="1310" y2="170" stroke="#1f4f55" stroke-width="4" stroke-linecap="round" />
  <circle cx="930" cy="170" r="17" fill="#123b40" />
  <circle cx="1110" cy="170" r="17" fill="#123b40" />
  <circle cx="1310" cy="170" r="17" fill="#123b40" />
  <text x="862" y="132" fill="#23383b" font-family="Georgia, 'Times New Roman', serif" font-size="36">hour</text>
  <text x="1010" y="132" fill="#23383b" font-family="Georgia, 'Times New Roman', serif" font-size="34">part_of_day</text>
  <text x="1328" y="132" fill="#23383b" font-family="Georgia, 'Times New Roman', serif" font-size="34">day_night_class</text>

  <!-- Station and geography hierarchy -->
  <ellipse cx="465" cy="475" rx="410" ry="115" fill="#dcefed" opacity="0.96" />
  <line x1="140" y1="480" x2="310" y2="480" stroke="#1f4f55" stroke-width="4" stroke-linecap="round" />
  <line x1="310" y1="480" x2="480" y2="480" stroke="#1f4f55" stroke-width="4" stroke-linecap="round" />
  <line x1="480" y1="480" x2="650" y2="480" stroke="#1f4f55" stroke-width="4" stroke-linecap="round" />
  <line x1="650" y1="480" x2="820" y2="480" stroke="#1f4f55" stroke-width="4" stroke-linecap="round" />
  <circle cx="140" cy="480" r="17" fill="#123b40" />
  <circle cx="310" cy="480" r="17" fill="#123b40" />
  <circle cx="480" cy="480" r="17" fill="#123b40" />
  <circle cx="650" cy="480" r="17" fill="#123b40" />
  <circle cx="820" cy="480" r="17" fill="#123b40" />
  <text x="58" y="438" fill="#23383b" font-family="Georgia, 'Times New Roman', serif" font-size="36">station</text>
  <text x="266" y="438" fill="#23383b" font-family="Georgia, 'Times New Roman', serif" font-size="36">NTA</text>
  <text x="410" y="438" fill="#23383b" font-family="Georgia, 'Times New Roman', serif" font-size="36">CDTA</text>
  <text x="668" y="438" fill="#23383b" font-family="Georgia, 'Times New Roman', serif" font-size="36">borough</text>
  <text x="835" y="438" fill="#23383b" font-family="Georgia, 'Times New Roman', serif" font-size="36">city</text>

  <!-- Weather context hierarchy -->
  <ellipse cx="1265" cy="430" rx="315" ry="100" fill="#e8f2ef" opacity="0.96" />
  <line x1="1110" y1="435" x2="1320" y2="435" stroke="#1f4f55" stroke-width="4" stroke-linecap="round" />
  <circle cx="1110" cy="435" r="17" fill="#123b40" />
  <circle cx="1320" cy="435" r="17" fill="#123b40" />
  <text x="948" y="392" fill="#23383b" font-family="Georgia, 'Times New Roman', serif" font-size="34">weather_day</text>
  <text x="1342" y="392" fill="#23383b" font-family="Georgia, 'Times New Roman', serif" font-size="34">condition_class</text>

  <!-- Calendar-event context hierarchy -->
  <ellipse cx="1215" cy="685" rx="320" ry="100" fill="#e8f2ef" opacity="0.96" />
  <line x1="1055" y1="690" x2="1255" y2="690" stroke="#1f4f55" stroke-width="4" stroke-linecap="round" />
  <circle cx="1055" cy="690" r="17" fill="#123b40" />
  <circle cx="1255" cy="690" r="17" fill="#123b40" />
  <text x="996" y="650" fill="#23383b" font-family="Georgia, 'Times New Roman', serif" font-size="36">date</text>
  <text x="1276" y="650" fill="#23383b" font-family="Georgia, 'Times New Roman', serif" font-size="34">holiday_window</text>
</svg>
